<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MAF Scaling – Open Loop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

<h1>MAF Scaling – Open Loop (WOT)</h1>
<div class="subtitle">
Baseline MAF table + WOT logs → new MAF table
</div>

<!-- OLD MAF -->
<div class="card">
<h2>Old MAF Table</h2>
<textarea id="mafTableInput" placeholder="Voltage, g/s
0.80, 14.32
0.82, 15.10
0.84, 15.95"></textarea>
</div>

<!-- LOGS -->
<div class="card">
<h2>WOT Logs (Open Loop)</h2>
<textarea id="logInput" placeholder="MAF Voltage, AFR Measured, AFR Target
2.34, 11.2, 11.0
2.36, 11.1, 11.0
2.38, 11.3, 11.0"></textarea>

<button onclick="addRun()">+ Add Run</button>
<div id="runList" class="run-list"></div>
</div>

<!-- ACTION -->
<div class="card">
<button class="primary" onclick="calculateMAF()">CALCULATE NEW MAF</button>
</div>

<!-- OUTPUT -->
<div class="card">
<h2>Result</h2>
<table id="outputTable">
<thead>
<tr>
<th>Voltage</th>
<th>Old g/s</th>
<th>New g/s</th>
<th>Δ %</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<!-- STATUS -->
<div class="card">
<h2>Status</h2>
<pre id="debug">Waiting for input…</pre>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
