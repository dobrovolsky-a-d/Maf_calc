<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VE Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>VE Calculator</h1>

  <section>
    <h2>Input</h2>
    <label>Log file<input type="file" id="loadLog"></label>
    <label>VE table<input type="file" id="loadVE"></label>
  </section>

  <section>
    <h2>Diagnostics</h2>
    <pre id="debug">No data loaded</pre>
  </section>

  <section>
    <button id="calculate">Calculate VE</button>
  </section>

  <section id="output"></section>

  <section>
    <button id="export" disabled>Export VE_new.csv</button>
  </section>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
